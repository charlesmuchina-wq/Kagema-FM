<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Stations Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        .custom-popup { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .station-name { 
            font-weight: bold; 
            font-size: 16px; 
            margin-bottom: 4px;
        }
        .station-country { 
            color: #666; 
            font-size: 14px;
            margin-bottom: 8px;
        }
        .play-btn {
            background: #1E88E5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .play-btn:hover {
            background: #1565C0;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Initialize map
        const map = L.map('map').setView([20, 0], 2);
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18,
        }).addTo(map);

        // Fetch stations from API
        const API_URL = window.location.origin.replace(':3000', ':8001');
        
        fetch(`${API_URL}/api/stations?limit=200&has_coordinates=true`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    const stations = data.data.stations.filter(s => s.latitude && s.longitude);
                    
                    stations.forEach(station => {
                        const marker = L.marker([station.latitude, station.longitude]);
                        
                        const popupContent = `
                            <div class="custom-popup">
                                <div class="station-name">${station.name}</div>
                                <div class="station-country">${station.country || 'Unknown'}</div>
                                <button class="play-btn" onclick="playStation('${station.stream_url}', '${station.name}')">
                                    ▶ Play Station
                                </button>
                            </div>
                        `;
                        
                        marker.bindPopup(popupContent);
                        marker.addTo(map);
                    });
                    
                    console.log(`Loaded ${stations.length} geocoded stations`);
                }
            })
            .catch(err => console.error('Error loading stations:', err));

        function playStation(url, name) {
            alert(`Playing: ${name}\nStream URL: ${url}`);
            // In a full implementation, this would integrate with the audio player
        }
    </script>
</body>
</html>
