<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Radio Stations Globe</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #globeViz { 
            height: 100vh; 
            width: 100vw; 
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 10;
        }
        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 10;
        }
        .label {
            font-weight: 600;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="info">
        <div class="label">🌍 Interactive 3D Globe</div>
        <div>Loading stations...</div>
    </div>
    <div id="stats">
        <div class="label">📊 Statistics</div>
        <div id="statsContent">Initializing...</div>
    </div>
    <div id="globeViz"></div>

    <script src="//unpkg.com/globe.gl"></script>
    <script>
        const API_URL = window.location.origin.replace(':3000', ':8001');
        let allStations = [];
        let currentZoom = 2;
        
        // Initialize globe with optimized settings
        const globe = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .pointAltitude(0.01)
            .pointRadius(0.18)
            .pointColor(d => {
                // Color code by quality
                const quality = d.quality_score || 0;
                if (quality >= 90) return '#4CAF50'; // Green - Excellent
                if (quality >= 80) return '#2196F3'; // Blue - Very Good
                if (quality >= 70) return '#FF9800'; // Orange - Good
                return '#9E9E9E'; // Gray - Average
            })
            .pointLabel(d => `
                <div style="padding: 10px; background: rgba(0,0,0,0.95); border-radius: 8px; max-width: 250px; border-left: 3px solid #1E88E5;">
                    <div style="font-weight: 600; font-size: 14px; margin-bottom: 4px; color: #1E88E5;">${d.name}</div>
                    <div style="color: #ccc; font-size: 12px; margin-bottom: 4px;">📍 ${d.country}</div>
                    <div style="color: #4CAF50; font-size: 11px; margin-bottom: 4px;">⭐ Quality: ${d.quality_score || 'N/A'}</div>
                    <div style="color: #999; font-size: 10px;">🔗 Click to play</div>
                </div>
            `)
            .onPointClick(d => {
                const popup = document.createElement('div');
                popup.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: white;
                    padding: 20px;
                    border-radius: 12px;
                    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                    z-index: 10000;
                    max-width: 400px;
                `;
                popup.innerHTML = `
                    <h3 style="margin: 0 0 10px 0; color: #1E88E5;">${d.name}</h3>
                    <p style="margin: 5px 0;"><strong>Country:</strong> ${d.country}</p>
                    <p style="margin: 5px 0;"><strong>Quality:</strong> ${d.quality_score || 'N/A'}</p>
                    <button onclick="this.parentElement.remove()" style="
                        background: #1E88E5;
                        color: white;
                        border: none;
                        padding: 10px 20px;
                        border-radius: 6px;
                        cursor: pointer;
                        margin-top: 10px;
                        width: 100%;
                    ">Close</button>
                `;
                document.body.appendChild(popup);
            });

        // Optimized auto-rotate
        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.25;
        globe.controls().enableZoom = true;

        // Dynamic Level of Detail based on zoom
        globe.controls().addEventListener('change', () => {
            const distance = globe.camera().position.length();
            const newZoom = distance < 300 ? 'close' : distance < 500 ? 'medium' : 'far';
            
            if (newZoom !== currentZoom) {
                currentZoom = newZoom;
                updatePointsLOD();
            }
        });

        // Fetch ALL stations with coordinates
        async function loadAllStations() {
            document.querySelector('#info div:last-child').innerHTML = 'Loading all stations...';
            
            try {
                const response = await fetch(`${API_URL}/api/stations?limit=20000&has_coordinates=true`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    allStations = data.data.stations
                        .filter(s => s.latitude && s.longitude)
                        .map(s => ({
                            lat: s.latitude,
                            lng: s.longitude,
                            name: s.name,
                            country: s.country || 'Unknown',
                            quality_score: s.quality_score || 0,
                            stream_url: s.stream_url
                        }));
                    
                    // Initial render with all stations
                    globe.pointsData(allStations);
                    updateUI();
                    
                    console.log(`Loaded ${allStations.length} geocoded stations on 3D globe`);
                }
            } catch (err) {
                console.error('Error loading stations:', err);
                document.querySelector('#info div:last-child').innerHTML = 
                    '<span style="color: #ff5555;">Error loading stations</span>';
            }
        }

        function updatePointsLOD() {
            // Dynamically adjust point size based on zoom level
            if (currentZoom === 'close') {
                globe.pointRadius(0.25);
            } else if (currentZoom === 'medium') {
                globe.pointRadius(0.18);
            } else {
                globe.pointRadius(0.15);
            }
        }

        function updateUI() {
            const countries = new Set(allStations.map(s => s.country)).size;
            const avgQuality = (allStations.reduce((sum, s) => sum + s.quality_score, 0) / allStations.length).toFixed(1);
            
            document.querySelector('#info div:last-child').innerHTML = 
                `<strong>${allStations.length.toLocaleString()}</strong> stations loaded<br>
                 <span style="color: #4CAF50; font-size: 12px;">All geocoded stations visible!</span>`;
            
            document.getElementById('statsContent').innerHTML = 
                `📻 Stations: <strong>${allStations.length.toLocaleString()}</strong><br>
                 🌍 Countries: <strong>${countries}</strong><br>
                 ⭐ Avg Quality: <strong>${avgQuality}</strong><br>
                 <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.2);">
                    <div style="font-size: 11px; color: #4CAF50;">🟢 Excellent (90+)</div>
                    <div style="font-size: 11px; color: #2196F3;">🔵 Very Good (80+)</div>
                    <div style="font-size: 11px; color: #FF9800;">🟠 Good (70+)</div>
                    <div style="font-size: 11px; color: #9E9E9E;">⚪ Average (&lt;70)</div>
                 </div>`;
        }

        // Performance monitoring
        let frameCount = 0;
        let lastTime = performance.now();
        
        function monitorPerformance() {
            frameCount++;
            const now = performance.now();
            
            if (now - lastTime >= 1000) {
                const fps = Math.round(frameCount * 1000 / (now - lastTime));
                console.log(`FPS: ${fps}, Stations: ${allStations.length}`);
                frameCount = 0;
                lastTime = now;
            }
            
            requestAnimationFrame(monitorPerformance);
        }
        
        monitorPerformance();
        
        // Load stations on page load
        loadAllStations();
    </script>
</body>
</html>
