<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Radio Stations Globe</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #globeViz { 
            height: 100vh; 
            width: 100vw; 
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 10;
        }
        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 10;
        }
        .label {
            font-weight: 600;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="info">
        <div class="label">🌍 Interactive 3D Globe</div>
        <div>Loading stations...</div>
    </div>
    <div id="stats">
        <div class="label">📊 Statistics</div>
        <div id="statsContent">Initializing...</div>
    </div>
    <div id="globeViz"></div>

    <script src="//unpkg.com/globe.gl"></script>
    <script>
        const API_URL = window.location.origin.replace(':3000', ':8001');
        
        // Initialize globe
        const globe = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .pointAltitude(0.01)
            .pointRadius(0.25)
            .pointColor(() => '#1E88E5')
            .pointLabel(d => `
                <div style="padding: 10px; background: rgba(0,0,0,0.9); border-radius: 8px; max-width: 250px;">
                    <div style="font-weight: 600; font-size: 14px; margin-bottom: 4px;">${d.name}</div>
                    <div style="color: #aaa; font-size: 12px; margin-bottom: 8px;">${d.country}</div>
                    <div style="color: #1E88E5; font-size: 11px;">Quality: ${d.quality_score || 'N/A'}</div>
                </div>
            `)
            .onPointClick(d => {
                alert(`🎵 ${d.name}\\n📍 ${d.country}\\n🔗 ${d.stream_url}`);
            });

        // Auto-rotate
        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.3;

        // Fetch and display stations
        fetch(`${API_URL}/api/stations?limit=300&has_coordinates=true`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    const stations = data.data.stations
                        .filter(s => s.latitude && s.longitude)
                        .map(s => ({
                            lat: s.latitude,
                            lng: s.longitude,
                            name: s.name,
                            country: s.country || 'Unknown',
                            quality_score: s.quality_score,
                            stream_url: s.stream_url
                        }));
                    
                    globe.pointsData(stations);
                    
                    // Update UI
                    document.querySelector('#info div:last-child').innerHTML = 
                        `${stations.length} stations loaded<br>
                         <span style="color: #1E88E5; font-size: 12px;">Click stations to view details</span>`;
                    
                    document.getElementById('statsContent').innerHTML = 
                        `📻 Stations: ${stations.length}<br>
                         🌍 Countries: ${new Set(stations.map(s => s.country)).size}<br>
                         🎯 Click to explore`;
                    
                    console.log(`Loaded ${stations.length} geocoded stations on 3D globe`);
                }
            })
            .catch(err => {
                console.error('Error loading stations:', err);
                document.querySelector('#info div:last-child').innerHTML = 
                    '<span style="color: #ff5555;">Error loading stations</span>';
            });
    </script>
</body>
</html>
