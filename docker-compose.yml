# Local development stack: backend (FastAPI) + MongoDB.
# Usage: `docker compose up --build`
# Decouples local runs from the Emergent platform image. For integrations (maps,
# AI, music), copy backend/.env.example to backend/.env and add an `env_file`
# entry, or extend `environment` below.
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Loads EMERGENT_LLM_KEY, JWT_SECRET and any other keys from backend/.env.
    # Optional: the stack still starts if the file is absent (copy
    # backend/.env.example to backend/.env to enable integrations).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # These override any value in env_file so the backend reaches the
      # compose-network MongoDB regardless of local .env contents.
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: kagema_fm_db
    depends_on:
      - mongodb
    ports:
      - "8001:8001"

volumes:
  mongo-data:
