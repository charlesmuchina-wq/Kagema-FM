name: Radio App Monitor & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  monitor-and-repair:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-node: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Audit & Auto-Repair Dependencies
      run: |
        npm audit fix --audit-level=moderate || true

    - name: Run Linter
      run: npm run lint -- --fix || true

    - name: Validate Radio Browser API Streams
      run: npm test
